<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product requirements</title>
<link rel="stylesheet" href="/ff.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  /* A document, not a dashboard: one white sheet on the founderfirst paper, contents on the left. */
  .layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 36px; padding-block: 32px 72px; align-items: start; max-width: 1180px; }
  .toc { position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); font-size: var(--fs-label); max-height: calc(100vh - 100px); overflow-y: auto; }
  .toc .eyebrow { margin-bottom: 8px; }
  .toc ol { list-style: none; margin: 0; padding: 0; }
  .toc a { display: flex; gap: 8px; padding: 5px 10px; border-radius: 8px; color: var(--ink-3); text-decoration: none; border-left: 2px solid transparent; line-height: 1.35; }
  .toc a .n { color: var(--ink-4); font-variant-numeric: tabular-nums; min-width: 18px; }
  .toc a:hover { color: var(--ink); background: var(--white); }
  .toc a.on { color: var(--brand-strong); border-left-color: var(--brand); background: var(--white); }
  .toc a.pending { color: var(--ink-4); }
  .sheet { background: var(--white); border-radius: var(--r-card-emph); box-shadow: var(--shadow-float-lg); padding: clamp(24px, 5vw, 64px); max-width: 880px; min-width: 0; }
  .doc-kind { font-size: var(--fs-eyebrow); font-weight: 600; letter-spacing: var(--ls-eyebrow); text-transform: uppercase; color: var(--brand); }
  .sheet h1 { font-size: clamp(30px, 4vw, 42px); margin-top: 10px; text-wrap: balance; }
  .control { width: 100%; margin-top: 22px; border: 1px solid var(--line-2); border-radius: var(--r-card); border-collapse: separate; border-spacing: 0; overflow: hidden; }
  .control th { width: 150px; background: var(--paper); text-transform: none; letter-spacing: 0; font-size: var(--fs-label); color: var(--ink-3); font-weight: 500; }
  .control td, .control th { padding: 9px 14px; border-bottom: 1px solid var(--line-2); }
  .control tr:last-child td, .control tr:last-child th { border-bottom: 0; }
  .exec { margin-top: 28px; padding: 22px 24px; border-radius: var(--r-card); background: var(--brand-tint); border: 1px solid var(--brand-soft); }
  .exec .eyebrow { color: var(--brand-strong); }
  .exec .rec { font-family: var(--font-display); font-size: 20px; line-height: 1.4; margin-top: 8px; color: var(--ink); }
  .exec .ask { margin-top: 12px; font-size: var(--fs-label); color: var(--ink-2); }

  /* Document body */
  .doc section { scroll-margin-top: 84px; }
  .doc h2 { font-size: 24px; margin: 44px 0 12px; padding-top: 28px; border-top: 1px solid var(--line-2); display: flex; gap: 12px; align-items: baseline; }
  .doc h2 .n { color: var(--brand); font-variant-numeric: tabular-nums; }
  .doc h3 { font-size: 17px; margin: 24px 0 8px; }
  .doc h4 { font: 600 var(--fs-eyebrow)/1.4 var(--font-sans); letter-spacing: var(--ls-eyebrow); text-transform: uppercase; color: var(--ink-4); margin: 20px 0 6px; }
  .doc p, .doc li { font-size: 15.5px; line-height: 1.68; color: var(--ink-2); }
  .doc p { margin: 10px 0; max-width: 72ch; }
  .doc ul, .doc ol { margin: 10px 0 14px; padding-left: 24px; max-width: 72ch; }
  .doc ul { list-style: disc; } .doc ol { list-style: decimal; }
  .doc ul ul { list-style: circle; } .doc li { margin: 4px 0; padding-left: 4px; }
  .doc li::marker { color: var(--brand); }
  .doc strong { color: var(--ink); font-weight: 600; }
  .doc .tw { overflow-x: auto; margin: 14px 0 18px; border: 1px solid var(--line-2); border-radius: var(--r-card); }
  .doc table { font-size: 13.5px; }
  .doc th { background: var(--paper); text-transform: none; letter-spacing: 0; font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
  .doc td { color: var(--ink-2); }
  .doc td:first-child { color: var(--ink); }
  .doc blockquote { margin: 14px 0; padding: 12px 16px; background: var(--paper); border-left: 3px solid var(--brand); border-radius: 0 var(--r-card) var(--r-card) 0; }
  .doc blockquote p { margin: 4px 0; }
  .doc pre { background: var(--dark); color: #dfe6ec; padding: 16px 18px; border-radius: var(--r-card); overflow-x: auto; line-height: 1.55; position: relative; font-size: 12.5px; }
  .doc :not(pre) > code { background: var(--line-2); padding: 1px 6px; border-radius: 6px; color: var(--ink); font-size: .9em; }
  .doc hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
  .doc .pending { display: flex; gap: 10px; align-items: center; padding: 14px 16px; border: 1.5px dashed var(--line); border-radius: var(--r-card); color: var(--ink-3); font-size: var(--fs-label); }
  .doc .flash { animation: flash 1.8s var(--ease-out); }
  @keyframes flash { 0% { background: var(--brand-tint); } 100% { background: transparent; } }
  .rid { display: inline-block; font: 600 11px var(--font-mono); background: var(--paper); color: var(--ink); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; white-space: nowrap; }
  .assumed { background: var(--amber-bg); color: var(--amber-strong); border: 1px solid #f1dfc2; padding: 0 6px; border-radius: 6px; font-size: .85em; white-space: nowrap; }
  .copy { position: absolute; top: 10px; right: 10px; height: 28px; padding: 0 12px; border-radius: var(--r-pill); border: 0; background: var(--brand); color: var(--white); font: 500 12px var(--font-sans); cursor: pointer; }
  .live { display: none; } .live.on { display: inline-flex; }
  .toast { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--dark); color: var(--white); padding: 10px 18px; border-radius: var(--r-pill); font-size: var(--fs-label); opacity: 0; transition: opacity var(--dur-base); z-index: 60; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } .toc { display: none; } }
  @media print { .site-nav, .toc, .copy { display: none !important; } .layout { display: block; } .sheet { box-shadow: none; padding: 0; } body { background: #fff; } }
</style>
</head>
<body>
<nav class="site-nav">
  <div class="wrap nav-inner">
    <span class="logo"><span class="mark">PRD</span><span id="navTitle" class="hide-sm">Product requirements</span></span>
    <span class="spacer"></span>
    <span class="pill ok live" id="live">Live: updates as the session decides</span>
    <a class="btn ghost sm hide-sm" id="mdLink" href="prd.md" download>Markdown</a>
    <a class="btn solid sm" id="protoLink" href="http://localhost:4317">Open prototype</a>
  </div>
</nav>
<div class="wrap layout">
  <aside class="toc" aria-label="Contents"><div class="eyebrow">Contents</div><ol id="toc"></ol></aside>
  <article class="sheet">
    <div class="doc-kind">Product requirements document</div>
    <h1 id="title">Product requirements</h1>
    <table class="control" id="control"></table>
    <div class="exec" id="exec"></div>
    <div class="doc" id="doc"></div>
  </article>
</div>
<div class="toast" id="toast" role="status"></div>
<!--PRD_DATA-->
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const GATE_NAME = { V: "Value", A: "AI-fit", L: "Labels", U: "User-in-the-loop", E: "Evals", D: "Deploy and drive", B: "Build" };
const LIVE = !window.__PRD__ && location.protocol.startsWith("http");
let lastText = "";

/* Markdown: the marked library when it loads; a plain fallback otherwise. */
function mdToHtml(text) {
  if (window.marked) return window.marked.parse(text, { gfm: true, breaks: false });
  return text.split(/\n{2,}/).map((b) => `<p>${esc(b)}</p>`).join("");
}
function mdInline(s) { return window.marked ? window.marked.parseInline(s) : esc(s.replace(/\*\*/g, "")); }
/* Light touches on text only: requirement IDs and (assumed) markers; tables get a scroll wrapper. */
function decorate(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: (n) => (n.parentElement.closest("pre, code, .rid, .assumed") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT) });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes) {
    if (!/\b(?:FR|NFR|G|M|R|T|Q|US)-\d{1,3}\b|\(assumed\)/i.test(n.nodeValue)) continue;
    const span = document.createElement("span");
    span.innerHTML = esc(n.nodeValue).replace(/\b((?:FR|NFR|G|M|R|T|Q|US)-\d{1,3})\b/g, '<span class="rid">$1</span>').replace(/\((assumed)\)/gi, '<span class="assumed">assumed</span>');
    n.replaceWith(...span.childNodes);
  }
  root.querySelectorAll("table").forEach((t) => { if (!t.parentElement.classList.contains("tw") && !t.classList.contains("control")) { const w = document.createElement("div"); w.className = "tw"; t.replaceWith(w); w.appendChild(t); } });
  root.querySelectorAll("pre").forEach((p) => { if (!p.querySelector(".copy")) { const b = document.createElement("button"); b.className = "copy"; b.textContent = "Copy"; p.prepend(b); } });
}

function parse(text) {
  const parts = text.replace(/\r/g, "").split(/^## /m);
  const head = parts.shift();
  const title = (head.match(/^#\s+(.*)$/m) || [, "Product requirements"])[1].replace(/:\s*product requirements$/i, "");
  const metaLine = (head.match(/^\*\*Client:\*\*.*$/m) || [""])[0];
  const meta = metaLine.split("·").map((x) => x.trim()).filter(Boolean).map((x) => { const m = x.match(/^\*\*([^*]+?):?\*\*:?\s*(.*)$/); return m ? [m[1], m[2]] : null; }).filter(Boolean);
  const quote = head.split("\n").filter((l) => /^>/.test(l)).map((l) => l.replace(/^>\s?/, ""));
  const sections = parts.map((p) => {
    const nl = p.indexOf("\n"), heading = (nl < 0 ? p : p.slice(0, nl)).trim(), body = nl < 0 ? "" : p.slice(nl + 1).trim();
    const m = heading.match(/^(\d+)\.\s*(.*)$/);
    const gate = (body.match(/^>\s*Pending: fills at gate (\w)/im) || [])[1] || null;
    return { num: m ? m[1] : "A", name: m ? m[2] : heading, body, gate, id: "s-" + (m ? m[1] : "appendix") };
  });
  return { title, meta, quote, sections };
}

function render(text, flashIds = []) {
  const d = parse(text);
  document.title = `${d.title}: PRD`; $("#title").textContent = d.title; $("#navTitle").textContent = d.title;
  const done = d.sections.filter((s) => !s.gate).length;
  const status = done === d.sections.length ? "Draft for client review" : `Live draft: ${done} of ${d.sections.length} sections complete`;
  const version = String((d.meta.find(([k]) => /^version$/i.test(k)) || [, "0.1"])[1]).split(",")[0];
  const rows = [...d.meta.filter(([k]) => !/^version$/i.test(k)), ["Version", version], ["Status", status]];
  $("#control").innerHTML = rows.map(([k, v]) => `<tr><th>${esc(k)}</th><td>${mdInline(v)}</td></tr>`).join("");
  const rec = d.quote.find((q) => /Recommendation/.test(q)), ask = d.quote.find((q) => /Decision asked/.test(q));
  $("#exec").innerHTML = rec
    ? `<div class="eyebrow">Executive summary</div><div class="rec">${mdInline(rec.replace(/\*\*Recommendation\.\*\*\s*/, ""))}</div>${ask ? `<div class="ask">${mdInline(ask)}</div>` : ""}`
    : `<div class="eyebrow">Executive summary</div><div class="rec" style="color:var(--ink-3)">The recommendation is written once every gate has been decided.</div>`;
  $("#toc").innerHTML = d.sections.map((s) => `<li><a href="#${s.id}" class="${s.gate ? "pending" : ""}"><span class="n">${s.num === "A" ? "" : s.num + "."}</span><span>${esc(s.name)}</span></a></li>`).join("");
  $("#doc").innerHTML = d.sections.map((s) => `<section id="${s.id}"><h2>${s.num === "A" ? "" : `<span class="n">${s.num}.</span>`}<span>${esc(s.name)}</span></h2>${s.gate
    ? `<div class="pending"><span class="pill plain">Gate ${esc(s.gate)}</span>To be completed when gate ${esc(s.gate)}, ${esc(GATE_NAME[s.gate] || "")}, is decided.</div>`
    : `<div class="body">${mdToHtml(s.body)}</div>`}</section>`).join("");
  decorate($("#doc")); decorate($("#exec")); decorate($("#control"));
  flashIds.forEach((id) => document.getElementById(id)?.classList.add("flash"));
  spy();
  return d;
}

let observer;
function spy() {
  observer?.disconnect();
  const links = [...document.querySelectorAll("#toc a")];
  observer = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) links.forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id)); }), { rootMargin: "-15% 0px -75% 0px" });
  document.querySelectorAll(".doc section").forEach((s) => observer.observe(s));
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2600); }

async function poll() {
  try {
    const text = await fetch("/prd.md", { cache: "no-store" }).then((r) => r.text());
    if (text === lastText) return;
    const before = lastText ? parse(lastText).sections.filter((s) => !s.gate).map((s) => s.id) : null;
    const y = scrollY; lastText = text;
    const fresh = before ? parse(text).sections.filter((s) => !s.gate && !before.includes(s.id)) : [];
    render(text, fresh.map((s) => s.id)); scrollTo(0, y);
    if (fresh.length) toast(`Updated: ${fresh.map((s) => s.name).join(", ")}`);
  } catch {}
}
document.addEventListener("click", (e) => {
  const b = e.target.closest(".copy"); if (!b) return;
  navigator.clipboard.writeText(b.parentElement.querySelector("code")?.textContent || "").then(() => { b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy"), 1500); }).catch(() => {});
});

if (LIVE) {
  $("#live").classList.add("on"); if ($("#mdLink")) $("#mdLink").href = "/prd.md"; $("#protoLink").href = "/";
  poll(); setInterval(poll, 3000);
} else {
  lastText = window.__PRD__ || "# Product requirements"; render(lastText);
  if (window.__PROTO__) { $("#protoLink").href = window.__PROTO__; $("#protoLink").target = "_blank"; const md = $("#mdLink"); if (md) md.hidden = true; }
}
</script>
</body>
</html>
