<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product requirements</title>
<link rel="stylesheet" href="proto/ff.css">
<style>
  .layout { display: grid; grid-template-columns: 240px 1fr; gap: 32px; padding: 32px 0 64px; align-items: start; }
  .toc { position: sticky; top: 84px; font-size: var(--fs-label); }
  .toc a { display: block; padding: 6px 10px; border-radius: 8px; color: var(--ink-3); text-decoration: none; border-left: 2px solid transparent; }
  .toc a:hover { color: var(--ink); background: var(--white); }
  .toc a.on { color: var(--brand-strong); border-left-color: var(--brand); background: var(--white); }
  .doc { background: var(--white); border-radius: var(--r-card-emph); box-shadow: var(--shadow-float-lg); padding: clamp(24px, 4vw, 56px); min-width: 0; }
  .doc h1 { font-size: clamp(30px, 4vw, 44px); margin-bottom: 8px; }
  .doc h2 { margin: 44px 0 14px; padding-top: 20px; border-top: 1px solid var(--line-2); scroll-margin-top: 80px; }
  .doc h3 { margin: 26px 0 10px; }
  .doc h4 { font: 600 var(--fs-eyebrow)/1.4 var(--font-sans); letter-spacing: var(--ls-eyebrow); text-transform: uppercase; color: var(--ink-4); margin: 22px 0 8px; }
  .doc p, .doc li { color: var(--ink-2); max-width: 74ch; }
  .doc p { margin: 10px 0; }
  .doc ul, .doc ol { padding-left: 22px; margin: 10px 0; }
  .doc li { margin: 4px 0; }
  .doc table { margin: 14px 0; border: 1px solid var(--line-2); border-radius: var(--r-card); overflow: hidden; display: block; overflow-x: auto; }
  .doc th { background: var(--paper); }
  .doc blockquote { margin: 16px 0; padding: 14px 18px; background: var(--brand-tint); border-radius: var(--r-card); color: var(--ink); border: 1px solid var(--brand-soft); }
  .doc blockquote p { margin: 4px 0; color: var(--ink); }
  .doc pre { background: var(--dark); color: #dfe6ec; padding: 16px 18px; border-radius: var(--r-card); overflow-x: auto; line-height: 1.5; position: relative; }
  .doc :not(pre) > code { background: var(--line-2); padding: 1px 6px; border-radius: 6px; color: var(--ink); }
  .doc hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
  .rid { display: inline-block; font: 600 11px var(--font-mono); background: var(--dark); color: var(--white); padding: 2px 7px; border-radius: 6px; letter-spacing: .02em; }
  .assumed { background: var(--amber-bg); color: var(--amber-strong); border: 1px solid #f1dfc2; padding: 0 6px; border-radius: 6px; font-size: .9em; }
  .copy { position: absolute; top: 10px; right: 10px; height: 28px; padding: 0 12px; border-radius: var(--r-pill); border: 0; background: var(--brand); color: var(--white); font: 500 12px var(--font-sans); cursor: pointer; }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .toc { display: none; } }
  @media print { .site-nav, .toc, .copy { display: none !important; } .layout { display: block; } .doc { box-shadow: none; padding: 0; } body { background: #fff; } }
</style>
</head>
<body>
<nav class="site-nav">
  <div class="wrap nav-inner">
    <span class="logo"><span class="mark">PRD</span><span id="navTitle">Product requirements</span></span>
    <span class="spacer"></span>
    <span class="pill plain hide-sm">Synthetic data</span>
    <a class="btn ghost sm" id="mdLink" href="prd.md" download>Download .md</a>
    <a class="btn solid sm" href="http://localhost:4317" rel="noopener">Open prototype</a>
  </div>
</nav>
<div class="wrap layout">
  <aside class="toc" id="toc"></aside>
  <article class="doc" id="doc"></article>
</div>
<script>
const SRC = {{PRD_JSON}};

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>')
    .replace(/\b((?:FR|NFR|AI|G|M|R|T|AC|Q)-\d{1,3})\b/g, '<span class="rid">$1</span>')
    .replace(/\((assumed)\)/gi, '<span class="assumed">assumed</span>');
}
const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");

function render(md) {
  const lines = md.replace(/\r/g, "").split("\n"); let html = "", i = 0;
  const isTable = (l) => /^\s*\|.*\|\s*$/.test(l);
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) {
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; html += `<pre><button class="copy">Copy</button><code>${esc(buf.join("\n"))}</code></pre>`; continue;
    }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))) { const n = m[1].length; html += `<h${n} id="${slug(m[2])}">${inline(m[2])}</h${n}>`; i++; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { html += "<hr>"; i++; continue; }
    if (isTable(l) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      html += "<table><thead><tr>" + cells(l).map((c) => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>";
      i += 2;
      while (i < lines.length && isTable(lines[i])) html += "<tr>" + cells(lines[i++]).map((c) => `<td>${inline(c)}</td>`).join("") + "</tr>";
      html += "</tbody></table>"; continue;
    }
    if (/^>\s?/.test(l)) {
      const buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
      html += `<blockquote>${buf.map((b) => `<p>${inline(b)}</p>`).join("")}</blockquote>`; continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const ordered = /^\s*\d+\./.test(l); const buf = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) buf.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ""));
      html += `<${ordered ? "ol" : "ul"}>${buf.map((b) => `<li>${inline(b)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`; continue;
    }
    if (!l.trim()) { i++; continue; }
    const buf = []; while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|>|\s*\||\s*([-*]|\d+\.)\s)/.test(lines[i])) buf.push(lines[i++]);
    if (!buf.length) buf.push(lines[i++]);
    html += `<p>${inline(buf.join(" "))}</p>`;
  }
  return html;
}

if (location.protocol.startsWith("http")) document.getElementById("mdLink").href = "/prd.md";
const doc = document.getElementById("doc");
doc.innerHTML = render(SRC);
const h1 = doc.querySelector("h1"); if (h1) { document.title = h1.textContent; document.getElementById("navTitle").textContent = h1.textContent; }
const toc = document.getElementById("toc");
toc.innerHTML = [...doc.querySelectorAll("h2")].map((h) => `<a href="#${h.id}">${h.textContent}</a>`).join("");
const links = [...toc.querySelectorAll("a")];
const spy = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) links.forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id)); }), { rootMargin: "-20% 0px -70% 0px" });
doc.querySelectorAll("h2").forEach((h) => spy.observe(h));
doc.addEventListener("click", (e) => {
  if (!e.target.classList.contains("copy")) return;
  navigator.clipboard.writeText(e.target.nextElementSibling.textContent).then(() => { e.target.textContent = "Copied"; setTimeout(() => (e.target.textContent = "Copy"), 1500); });
});
</script>
</body>
</html>
