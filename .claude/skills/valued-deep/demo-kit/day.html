/* The five channels from the brief, each with today's failure and the new flow */
const CH = [
  { key: "Voice", icon: "bot", tag: "Automated phone line, no person", name: "Phone bot", when: "Sunday, 9:12 PM",

    "Advocate desk": [PD["PD-A"], "Agent Assist shows this one wording; the 2025 cheat sheet is retired and no longer searchable."], Outbound: [TEXT_OK, "Only this approved line goes out, only to members who agreed."], Website: [STAR_2027, "The 2026 rating left every channel on 29 Oct by itself."] }[c.key];

  return { html, last: first ? first.r : last, read: first ? first.read : read, asked };
}
function impactHTML(c, m) { const x = m === "today" ? c.issue : c.fix, t = m === "today";
  const L = t ? ["The problem", "What it does to June", "What it leads to"] : ["What changes", "What it means for June", "What it means for the plan"];
  return `<div class="talk ${m}"><ul>${x.map((v, i) => `<li><b>${L[i]}:</b> ${esc(v)}</li>`).join("")}</ul></div>`; }
function nextHTML() {
  return (cur < CH.length - 1 ? `<div class="acts" style="justify-content:flex-end;margin-top:10px"><button class="btn primary" id="nextch">Next: ${esc(CH[cur + 1].name)} →</button></div>` : `<div class="acts" style="justify-content:flex-end;margin-top:10px">${mode === "today" ? "" : ""}</div>`); }
function bindNext() { const n = document.getElementById("nextch"); if (n) n.onclick = () => { stopAll(); cur++; draw(); scrollTo({ top: 0, behavior: "smooth" }); };
  const f = document.getElementById("fixit2"); if (f) f.onclick = () => { mode = "approach"; draw(); scrollTo({ top: 0, behavior: "smooth" }); }; }
function draw() {

  document.getElementById("tabs").style.display = mode === "approach" ? "none" : "";

    bindApproach(draw); const go = document.getElementById("toNew"); if (go) go.onclick = () => { location.href = "how1.html"; }; return; }

  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { stopAll(); cur = +b.dataset.t; draw(); });
  const c = CH[cur];

    document.getElementById("stage").innerHTML = `<div class="take ${mode}"><p class="eyebrow">Key takeaway</p><h2>${esc(t.title)}</h2><p class="big2">${esc(t.lead)}</p>
      <ol>${t.items.map(([ic, h, d], i) => `<li class="${i === t.items.length - 1 ? "last" : ""}"><span class="ticn">${TICON[ic]}</span><div><b>${esc(h)}</b><span>${esc(d)}</span></div></li>`).join("")}</ol>

    document.getElementById("graphcard").innerHTML = "";

    const b = document.getElementById("back1"); if (b) b.onclick = () => { cur = 0; draw(); scrollTo({ top: 0, behavior: "smooth" }); };

    document.getElementById("graphcard").innerHTML = `<h3>How ${esc(c.name.toLowerCase())} gets its answer today <span class="pill bad" style="font-size:11px">our assumption</span></h3>${todaySVG(c)}`;

  const rs = document.getElementById("restart"); if (rs) rs.onclick = () => { store.up(x => { if (x.optOut) delete x.optOut["June Halvorsen"]; logEv(x, "KU-202", "member", "re-consented to texts", "June Halvorsen"); }); draw(); };

function stopAll() { playing = false; if (audio) { audio.pause(); audio = null; } }
async function playChannel(i) {

  if (mode === "today") { const clips = { Voice: ["june1", "t_bot"], "Member chat": ["t_june_chat"], "Advocate desk": ["june4", "t_dana"], Website: ["t_june_web"] }[c.key] || [];
    for (const clip of clips) { if (!playing) return; await new Promise(res => { audio = new Audio("audio/" + clip + ".mp3"); audio.playbackRate = 0.9; audio.onended = res; audio.onerror = res; audio.play().catch(res); }); await new Promise(r => setTimeout(r, 400)); }
    if (playing) await new Promise(r => setTimeout(r, clips.length ? 3500 : 6000)); return; }
  if (!c.lines) { await new Promise(r => setTimeout(r, 5000)); return; }
  const steps = [...document.querySelectorAll(".step")], card = document.getElementById("graphcard"), after = document.querySelectorAll(".talk, #nextch, .more2");
  steps.forEach(x => x.classList.add("later")); after.forEach(x => x.classList.add("later"));
  let lastQ = null;
  for (let k = 0; k < c.lines.length && playing; k++) {
    const st = steps[k]; if (st) { st.classList.remove("later"); st.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
    document.querySelectorAll(".line").forEach(x => x.classList.remove("playing")); if (st) st.querySelector(".line").classList.add("playing");
    const m = c.lines[k][3] || {};
    if (m.q) { lastQ = { r: ASK(m.q, m.role, m.channel), read: m.read }; card.innerHTML = sideHTML(lastQ.r, lastQ.read, "find"); }
    else if (lastQ) { card.innerHTML = sideHTML(lastQ.r, lastQ.read, "rest"); lastQ = null; }
    const clip = c.lines[k][1];
    if (clip) await new Promise(res => { audio = new Audio("audio/" + clip + ".mp3"); audio.playbackRate = 0.9; audio.onended = res; audio.onerror = res; audio.play().catch(res); });
    else await new Promise(r => setTimeout(r, 2600));
    if (m.q && (m.assist || m.search)) { card.innerHTML = sideHTML(lastQ.r, lastQ.read, "rest"); lastQ = null; }
    await new Promise(r => setTimeout(r, 400));
  }
  after.forEach(x => x.classList.remove("later"));
  if (playing) await new Promise(r => setTimeout(r, 2500));
}
document.getElementById("mToday").onclick = () => { stopAll(); mode = "today"; draw(); };
