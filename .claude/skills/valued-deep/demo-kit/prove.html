const PEOPLE = { June: ["June Halvorsen", "Member", "JH", "m"], Dana: ["Dana Okafor", "Insurance advocate", "DO", "m"], Luis: ["Luis Ferreira", "Pharmacy advocate", "LF", "m"], Renee: ["Renee Caldwell", "Knowledge Operations lead", "RC", "p"], Priya: ["Priya Nandakumar", "Author", "PN", "p"], Writer: ["Independent test writer", "never saw the rules", "IW", "p"], System: ["Lakewell Knowledge", "release check", "LK", "sys"] };

  G4: "Star rating statement for 2027", G5: "Mail-order days' supply", G6: "Tier 3 copay for 2027", G7: "Out-of-pocket maximum for 2027", G8: "Dental rider",

  G21: "Out-of-network pharmacy in Agent Assist: reads Legal's exact words" };

  return `<div class="fe ${p[3]}"><span class="av">${esc(p[2])}</span><div class="fb"><p class="fh"><b>${esc(p[0])}</b> · ${esc(p[1])}</p><p class="fs">${esc(say)}</p>${body ? `<div class="fp">${body}</div>` : ""}</div></div>`; }

/* Each scene: ctx gives beat(i, say), push(who, say, body), reveal(el, ms) and T(ms); fast skips the waiting */
async function golden(c) {
  await c.beat(0, "Priya hands over the golden set"); c.push("Priya", "Hands over the golden set", `<div class="filec"><span class="fi">${FILEIC}</span><div><b>${E.R.length} questions with labelled answers</b><span class="small">pharmacy, insurance and channel questions; written by Priya, the author, and a second reviewer checks it in production, not yet in this prototype; the sealed holdout was written separately</span></div></div>`); await c.T(1300);

async function probes(c) {
  const N = E.PS.reduce((a, x) => a + x.rows.length, 0);
  await c.beat(0, "A writer who never saw the rules hands over the probe questions"); c.push("Writer", "Hands over the probe questions", `<div class="filec"><span class="fi">${FILEIC}</span><div><b>${N} probe questions, tested two ways</b><span class="small">${PROBES.length} written by someone who never saw the rules, and ${N - PROBES.length} added after every fix so nothing slips back: personal data, cost, years, languages, roles, near-misses</span></div></div>`); await c.T(1300);

    <div class="pbar"><i data-w="${x.must ? x.caught / x.must * 100 : 100}"></i></div><div class="sm2"><span>Refused or rerouted: ${x.caught} of ${x.must}</span><span>bar 100%</span></div>
