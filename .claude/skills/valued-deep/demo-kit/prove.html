<script>
/* Prove it: every number on this page is computed in this browser, now, by the same code as the full runner (eval-core.js) */

store.up(s => { if (!units(s).find(u => u.id === "KU-202" && u.current)) ENSURE.driftDone(s); });
const PEOPLE = { June: ["June Halvorsen", "Member", "JH", "m"], Dana: ["Dana Okafor", "Insurance advocate", "DO", "m"], Luis: ["Luis Ferreira", "Pharmacy advocate", "LF", "m"], Renee: ["Renee Caldwell", "Knowledge owner", "RC", "p"], Priya: ["Priya Nandakumar", "Author", "PN", "p"], Writer: ["Independent test writer", "never saw the rules", "IW", "p"], System: ["Lakewell Knowledge", "release check", "LK", "sys"] };

/* Each scene: ctx gives beat(i, say), push(who, say, body), reveal(el, ms) and T(ms); fast skips the waiting */
async function golden(c) {
  c.beat(0, "Priya hands over the golden set"); c.push("Priya", "Hands over the golden set", `<div class="filec"><span class="fi">${FILEIC}</span><div><b>${E.R.length} questions with labelled answers</b><span class="small">pharmacy, insurance and channel questions; labelled by the author, then reviewed</span></div></div>`); await c.T(1300);

  const el = c.push("System", "Runs each question, as each role, on each channel", `<div>${E.R.map(x => `<div class="qrow">${tick(x.pass)}<span class="qq"><span class="grp">${esc(GROUP(x.g.id))}</span>${esc(x.g.q)}</span><span class="qm">${esc(ROLES[x.g.role].person.split(" ")[0])} · expected ${esc(x.g.expect)}, got ${esc(x.r.kind)}</span></div>`).join("")}</div>`);

  c.beat(2, "Counted by group, never as one average");
  c.push("System", "Counts by group", `<div class="tiles" style="margin:0">${["Pharmacy", "Insurance", "Channel"].map(k => { const rows = E.col(k), n = rows.filter(x => x.pass).length; return `<div class="tile${n === rows.length ? "" : " bad"}"><div class="small">${k} questions</div><div class="n">${n} of ${rows.length}</div></div>`; }).join("")}</div>`); await c.T(1500);

async function probes(c) {

}
async function holdout(c) {

  c.push("System", "Checks the seal", `<div class="seal"><span>Written in a separate context and hashed before the first run</span><div>expected ${SEALED.slice(0, 20)}…</div><div>found&nbsp;&nbsp;&nbsp; ${(E.hh || "not available").slice(0, 20)}…</div><b style="color:${E.sealedOK ? "#3b6d11" : "#a3261b"}">${E.sealedOK ? "✓ Seal intact: nobody has changed it" : "✗ Seal not verified"}</b></div>`); await c.T(1800);

  c.beat(2, "Only counts are shown; the questions stay sealed");
  c.push("System", "Shows counts, never the questions", `<p class="small" style="margin:0">A count, not a rate, at this size. The holdout is never used to tune anything.</p>`); await c.T(1500);
}
async function gate(c) {

    ["Every answer cites an approved source", `${E.ans(E.R).filter(x => x.cites).length} of ${E.ans(E.R).length}`, E.ans(E.R).every(x => x.cites)], ["Legal's words exact", "0 changed characters", E.verbs(E.R).every(x => x.verb)],
    ["Routed to the right person or queue", "gap, author, translator, person", E.routes(E.R).every(x => x.routeOK && !x.answered)], ["Identifiers redacted (T4)", `${E.t4leak} of 50 leaked`, E.t4leak === 0],
    ["Audit trail complete (T3)", `${E.t3gaps} gaps in ${E.ev.length} events`, E.t3gaps === 0], ["Probe sets meet their bars", `${E.PS.filter(x => x.pass).length} of 6`, E.probesPass], ["Holdout sealed and green", `${E.H.filter(x => x.pass).length} of ${E.H.length}`, E.sealedOK && E.holdRulesOK]];

/* What still fails, from this run, and what earlier runs found and how each was fixed (from the decision log) */
const FIXED = [
  ["Cost questions slipped past the cost check", "Probes asked about what members are charged, owe or pay in fees", "The cost check now reads those words too, so the question goes to the gap queue instead of a guess"],
  ["A sealed holdout question was answered when it should have said \"not yet\"", "Right topic found, but the asked fact was not in it", "Fixed against new questions of the same kind written outside the holdout; the holdout was then rerun once, never used to tune"],
  ["The verdict could read Pass beside a red rule row", "The banner and the rule rows disagreed", "Any red rule row, on any set, now blocks the release"],
  ["The redaction test could not fail", "It reused the redactor's own pattern, so it graded itself", "The leak check is now independent and covers every member-ID format"],
  ["Price questions were wrongly refused", "\"Are prices final?\" was treated as a request for her records", "Price-policy questions are answered from the pricing disclaimer; her own records still go to a person"],
  ["Questions mentioning another person needed a rule", "\"The dental thing my neighbor has\" risked sharing someone else's coverage", "A general answer, never the other person's coverage; their records go to a person"],
  ["A member asking for the vision benefit was refused", "The probe said refuse; plans must disclose benefits to members", "Answered from the member-facing topic; the label was corrected in review, the probe file untouched"],
  ["A deadline label said \"7 days\" without calendar or working", "The holdout label was ambiguous", "Ruled 7 calendar days, as the regulation says; every deadline label now names which"]
];
async function improve(c) {

  const el = c.push("System", `${miss.length} probe questions still go wrong, all inside the release bar`, `<div>${miss.map(({ set, m }) => `<div class="qrow">${tick(false)}<span class="qq"><span class="grp">${esc(set)}</span>${esc(m.p.q)}</span><span class="qm">expected ${esc(m.p.expect === "ok" ? "an answer" : m.p.expect)}, got ${esc(m.r.kind === "person" ? "handed to a person" : m.r.kind === "nearmiss" ? "\"not yet\"" : m.r.kind)}</span></div>`).join("")}
    ${disp.map(d => `<div class="qrow"><span class="tk" style="background:#f9dfb2;color:#9a5a00">?</span><span class="qq">${esc(d.p.q)}</span><span class="qm">label disputed, not counted until ruled</span></div>`).join("")}</div>
    <p class="small" style="margin:8px 0 0">${above.length ? `Wrong refusals are above the 2% goal in ${above.map(x => `${x.set} (${x.falseN} of ${x.ok} general questions, ${x.rate}%)`).join(", ")}. That is inside the 10% launch bar, not yet where we want it.` : "Every set is at or under the 2% goal."}</p>`);
  await c.reveal(el, ".qrow", 380);
  c.beat(1, "What earlier runs caught, and how each was fixed");
  const f = c.push("System", "Found and fixed", `<div class="gates">${FIXED.map(([h, why, fix]) => `<div class="gate" style="align-items:flex-start">${tick(true)}<div style="flex:1"><b style="display:block">${esc(h)}</b><span class="gv">${esc(why)}</span><span class="gv" style="display:block;color:#3b6d11"><b>Fix:</b> ${esc(fix)}</span></div></div>`).join("")}</div>`);
  await c.reveal(f, ".gate", 650);
  c.beat(2, "Renee decides what happens to today's misses");
  const d = c.push("Renee", "Reviews and decides", `<div class="dec"><button class="btn sm primary fakeb" tabindex="-1">Add misses to the next run</button></div>`); await c.T(1100);
  d.querySelector(".fakeb").classList.add("press"); await c.T(450);
  d.querySelector(".dec").innerHTML = `<span class="stampd">✓ Queued</span><span class="small">Each miss is a test row in the next release; fixes are checked on new questions, never the holdout</span>`; await c.T(1300);

/* Observe: a week of questions (synthetic search log), the checks that keep running, and feedback with an owner */
const FB_SEED = [
  { who: "Dana", up: false, kind: "unclear", q: "Rx pricing disclaimer", text: "Right answer, but too long to read out on a call" },
  { who: "June", up: false, kind: "missing", q: "Is the dental rider on my plan?", text: "It couldn't tell me about the dental rider" },

];

const fbList = () => FB_SEED.concat((S().feedback || [])).map(x => `<div class="qrow"><span class="tk${x.up ? "" : " no"}">${x.up ? "👍" : "👎"}</span><span class="qq"><b>${esc(PEOPLE[x.who] ? PEOPLE[x.who][0] : x.who)}</b> on "${esc(x.q)}": ${esc(x.text || "")}</span><span class="qm">${esc(ROUTE[x.kind || ""])}</span></div>`).join("");
async function observe(c) {

  const byC = {}; gap.forEach(l => byC[l.cluster || "Other"] = (byC[l.cluster || "Other"] || 0) + l.n);
  c.beat(0, "One week of questions, by what happened to them");
  c.push("System", "A week of questions (synthetic search log)", `<div class="tiles" style="margin:0"><div class="tile"><div class="small">Questions asked</div><div class="n">${asked}</div></div><div class="tile"><div class="small">Answered from approved topics</div><div class="n">${asked - gapN}</div></div><div class="tile"><div class="small">Said "not yet" and logged</div><div class="n">${gapN}</div></div></div>

    ["Answers outside the asker's role", "0", "0", !E.R.some(x => x.leak)], ["Audit events with a gap", String(E.t3gaps), "0", E.t3gaps === 0], ["Unanswered questions this week (synthetic search log)", String(gapN), "falling week on week", null]];

    <select id="fbk"><option value="wrong">Wrong</option><option value="missing">Missing something</option><option value="unclear">Unclear</option><option value="">Helpful</option></select></div>

const FILEIC = `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 13h6M9 17h6"/></svg>`;

function takeHTML() {
  const N = E.PS.reduce((a, x) => a + x.rows.length, 0), items = [
    ["search", "Tested by group, not on average", `${E.R.filter(x => x.pass).length} of ${E.R.length} labelled questions pass, for every role and channel.`],
    ["shield", "Tested by someone who never saw the rules", `${N} independent questions; every must-refuse refused.`],
    ["lock", "A sealed set nobody tuned to", `${E.H.filter(x => x.pass).length} of ${E.H.length}, run once, seal ${E.sealedOK ? "intact" : "not verified"}.`],

    ["zap", "Every miss becomes a test", "A failure is added as a test row, never fixed silently."],
    ["calendar", "Run again before every release", "Same tests, same bars; the false-refusal bar tightens from 10% toward 2%."]];
  return `<div class="take new"><p class="eyebrow">Key takeaway</p><h2>Quality is proven before anything ships, and proven again every release.</h2><p class="big2">Every number here was computed in this browser just now, by the same code as the full runner.</p>
    <ol>${items.map(([ic, h, d], i) => `<li class="${i === items.length - 1 ? "last" : ""}"><span class="ticn">${TICON[ic] || ""}</span><div><b>${esc(h)}</b><span>${esc(d)}</span></div></li>`).join("")}</ol>
    <div class="acts" style="margin-top:28px"><a class="btn primary" href="evals.html">Open the full live runner →</a><a class="btn" href="product.html">Open the product, by person →</a><button class="btn" id="again">Run every test again</button></div></div>`;
}
function shell(t) {
  const n = cur + 1, next = TABS[cur + 1];
  document.getElementById("stage").innerHTML = `<p class="eyebrow">Renee, the knowledge owner</p><h2 class="hl">${esc(t.line())}</h2><p class="was1"><b>Without it:</b> ${esc(t.without)}</p>
    <div class="beats">${t.beats.map((b, i) => `<span data-b="${i}">${esc(b)}</span>`).join("")}</div><p class="narr" id="narr">&nbsp;</p>
    <div class="appwin"><div class="appbar"><i></i><i></i><i></i><span>Lakewell Knowledge · Release check</span><span style="flex:1"></span><button class="btn sm" id="replay">↻ Replay</button><button class="btn sm" id="skip">Skip to result</button></div><div class="feed" id="feed"></div></div>
    <div id="endc" class="endc" hidden><div class="now"><b>Result</b>${esc(t.line())}</div><div class="foot"><span></span><button class="btn primary" id="nextch">Next: ${esc(next.label)} →</button></div></div>`;
}
async function scene(fast) {
  const my = ++run, t = TABS[cur], live = () => my === run;
  if (!t.play) { document.getElementById("stage").innerHTML = takeHTML(); document.getElementById("again").onclick = async () => { E = await evalAll(S()); draw(); }; return my; }
  shell(t);
  document.getElementById("replay").onclick = () => scene(false); document.getElementById("skip").onclick = () => scene(true);
  document.getElementById("nextch").onclick = () => { playing = false; cur++; draw(); scrollTo({ top: 0, behavior: "smooth" }); };
  const feed = document.getElementById("feed"), down = () => feed.scrollTo({ top: feed.scrollHeight, behavior: fast ? "auto" : "smooth" });
  const c = {
    T: ms => live() ? wait(fast ? 0 : ms) : new Promise(() => {}),
    beat: (i, say) => { document.querySelectorAll("[data-b]").forEach((x, j) => x.className = j < i ? "done" : j === i ? "on" : ""); document.getElementById("narr").textContent = say; },
    push: (who, say, body) => { feed.insertAdjacentHTML("beforeend", feedItem(who, say, body)); down(); return feed.lastElementChild; },
    reveal: async (el, sel, ms, onIn) => { const rows = [...el.querySelectorAll(sel)]; if (fast) { rows.forEach(r => onIn && onIn(r)); return; }
      rows.forEach(r => r.classList.add("rv")); for (const r of rows) { await c.T(ms); r.classList.add("in"); if (onIn) onIn(r); down(); } }
  };
  await t.play(c); if (!live()) return my;
  c.beat(t.beats.length - 1, "Done."); document.querySelectorAll("[data-b]").forEach(x => x.className = "done");
  document.getElementById("endc").hidden = false; if (!fast) document.getElementById("endc").scrollIntoView({ block: "nearest", behavior: "smooth" });
  return my;
}
function draw() {
  document.getElementById("stepper").innerHTML = storyStepper(4);
  document.getElementById("tabs").innerHTML = TABS.map((x, i) => `<button data-t="${i}" class="${i === cur ? "on" : i < cur ? "done" : ""}"><i>${i + 1}</i><span>${esc(x.label)}</span></button>`).join("");
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { playing = false; cur = +b.dataset.t; draw(); });
  return scene(false);
}
document.getElementById("play").onclick = async () => { playing = true; cur = 0;
  while (playing) { const my = await draw(); if (!playing || my !== run) return; await wait(2500); if (!playing || my !== run) return; if (cur < TABS.length - 1) cur++; else { playing = false; return; } } };
document.getElementById("stop").onclick = () => { playing = false; run++; };
evalAll(S()).then(e => { E = e; if (QS.get("play") === "1") document.getElementById("play").click(); else draw(); });
</script></body></html>
