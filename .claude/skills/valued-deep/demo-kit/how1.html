<script>
nav("how1.html", "author", { demo: true });
const RX = DOCS.find(d => d.id === "DOC-RXV2"), SD = DOCS.find(d => d.id === "DOC-SD09"), INJ = (CORE_UNITS.find(u => u.id === "KU-214") || {}).injection;
const OON = (RX.sections.flatMap(s => s.blocks).find(b => b.verbatim && /network/.test(b.t || "")) || {}).t;
const COPAY = (SD.sections.flatMap(s => s.blocks).find(b => b.s === "M3") || {}).t;
window.ACT = {
  title: "Act 1 · Priya turns documents into knowledge", nav: "act1.html", role: "author",
  approachNext: "See the future state: Priya's documents, ready for every channel →", next: ["act2.html", "Next: Act 2 · Check and approve, once"],
  take: {
    today: { title: "What goes wrong before anyone answers a question", lead: "Every channel reads from documents nobody made ready: buried, messy, unsafe and duplicated.", items: [
      ["pencil", "Legal's words are buried", "The phone bot rewords what nothing marks as exact."], ["zap", "Sources can carry hidden orders", "The chat follows a line planted in a document."],
      ["clock", "Files mix junk, stale and clinical content", "Dana's search returns the whole messy file."], ["send", "Tables lose their context", "A text quotes a price with no year or owner."], ["copies", "The same words live in three places", "The website shows a copy Legal never approved."]] },
    new: { title: "What changes when Priya adds a document", lead: "The AI does the reading, a person decides, and nothing is searchable until approved.", items: [
      ["lock", "Legal's words, locked", "Marked once; read exactly in every channel."], ["shield", "Documents are data, not orders", "Planted instructions removed and logged."],
      ["inbox", "Messy files, sorted", "Skip, split, route clinical advice to a pharmacist."], ["calendar", "Tables become dated facts", "A 2026 copay is labelled 2026, with an owner."], ["source", "One wording stands", "Found, compared, proposed; Tom decides."]] }
  },
  channels: {
    Voice: { who: "The phone bot was built from the Rx Education Script, where Legal's words sit unmarked inside a long file.",
      today: () => `${docView(RX, b => b.verbatim ? "hide" : "")}${compare(PD["PD-A"], "Prices can change, so check with your plan.", "What the bot says", "The bot's own summary of section 4")}`,
      issue: ["Legal's exact words are buried in a long script, and nothing marks them as exact", "The bot sums them up in its own words, so June never hears the conditions Legal requires", "Every channel words the disclaimer its own way, which is how June ends up hearing five versions"],
      path: [["DOCUMENT", "Rx Education Script v2", "9 sections"], ["SAVED", "In the script library", "as one file"], ["NOT MARKED", "Legal's words unflagged", "inside section 4"], ["BOT", "Summarises them", "in its own words"]],
      now: () => `<div class="units">${unitCard("Pricing walk-through", "topic · Pharmacy · approver: Grace")}${unitCard("Pricing disclaimer", "locked legal words · approver: Tom", "locked", PD["PD-A"])}${unitCard("Out-of-network pharmacies", "locked legal words · approver: Tom", "locked", OON)}${unitCard("Spanish draft of the disclaimer", "machine translated: held for a qualified translator, never served", "flag")}</div>`,
      fix: ["The AI splits the script into short topics and marks the 'Verbatim (Legal)' lines as locked words", "The bot reads the locked words exactly, so June hears them as Legal wrote them", "Nothing is searchable until the right approver says yes"],
      fixpath: [["DOCUMENT", "Rx Education Script v2", "added by Priya"], ["TOPICS", "Split into short topics", "with source and tags"], ["LOCKED", "Legal's lines locked", "read exactly"], ["QUEUED", "Sent to the right approver", "Tom or Grace"]],
      fix4: { line: "Legal's lines are found and locked once, so every channel reads them exactly.", steps: [0, 1], tech: ["LLM-based extraction", "Constrained rendering"], kind: "AI proposes, a person decides", control: "Extraction splits the document into topics and marks candidate locked words; matching a known legal clause is a rule. Nothing is searchable until approved.", who: "Priya accepts or edits each topic; Tom approves locked words, Grace pharmacy content", proof: "Locked words checked character for character against the source (G1, G3)." } },
    "Member chat": { who: "The member chat answers from whatever documents it can read, including the Member Benefits Quick Guide.",
      today: () => `<div class="docv"><p class="small"><b>Member Benefits Quick Guide 2027</b> · Claims coverage summary</p><p>Most covered services are paid after your deductible.</p><p class="inj">${esc(INJ)}</p></div>${compare("Claims are covered according to your plan's Evidence of Coverage.", "Every claim is covered.", "What the chat tells June", "It followed the hidden line (illustrative)")}`,
      issue: ["A sentence inside a source is written as an order to the AI: '" + INJ + "'", "The chat follows it and tells June every claim is covered", "Members are promised coverage that doesn't exist, from text nobody approved"],
      path: [["SOURCE", "Quick Guide 2027", "intranet"], ["READ RAW", "The chat reads the file", "text and orders alike"], ["OBEYS", "The hidden line", "no check"], ["SAYS", "'Every claim is covered'", "untrue"]],
      now: () => `<div class="units">${unitCard("Claims coverage summary", "topic proposed · approver: Renee")}${unitCard("Planted instruction found and removed", INJ, "flag")}${unitCard("Logged for review", "which document, when, who added it", "skip")}</div>`,
      fix: ["Documents are treated as data, not orders: the planted line is removed at ingest and logged", "The chat answers only from approved text, so the hidden line can never reach June", "Someone sees that a source was tampered with"],
      fixpath: [["SOURCE", "Quick Guide 2027", "added by Priya"], ["SCANNED", "Instruction-like text found", "at ingest"], ["REMOVED", "Taken out and logged", "never reaches the model"], ["ANSWER", "Unaffected", "approved text only"]],
      fix4: { line: "Documents are data, not orders. The planted line is removed and logged.", steps: [0, 2], tech: ["Prompt-injection filtering", "Grounded generation"], kind: "Rule", control: "The answering model only ever sees approved topic text; instruction-like text found inside documents is logged, never followed.", who: "Renee reviews the log; the topic still goes through approval", proof: "Planted-instruction test G13: answer unaffected, instruction logged." } },
    "Advocate desk": { who: "Dana searches the shared drive and gets 'FINAL_v1 (2).docx', a file nobody owns.",
      today: () => `${docView(SD, b => b.junk ? (/2025/.test(b.t) ? "stale" : "junk") : b.s === "M4" ? "hide" : "")}${compare("Six separate facts, each with its own approver and date.", "One file returned whole: a 2025 price note, two facts in one line, a statin tip nobody clinical checked.", "What Dana's search returns", "Nothing separates the stale line or the clinical tip")}`,
      issue: ["A shared-drive file mixes a 'confidential' line, a 2025 price note, two facts in one sentence, a copay table and a clinical tip", "Dana may read June last year's prices, or health advice no pharmacist checked", "Nobody owns the file, so nobody knows it's out of date"],
      path: [["FILE", "FINAL_v1 (2).docx", "shared drive"], ["INDEXED", "As one block", "no structure"], ["MIXED", "Stale line, clinical tip", "nothing separated"], ["DANA", "Reads what she finds", "to June"]],
      now: () => `<div class="units">${(INGEST["DOC-SD09"] || []).map(p => p.skip ? unitCard(p.span + " skipped", p.skip, "skip") : p.split ? unitCard(p.span + ": two facts, split in two", "transition fill and the transition letter", "flag") : p.clinical ? unitCard(p.span + ": statin tip", "clinical guidance: routed to Grace", "flag") : p.dupOf ? unitCard(p.span + ": already known", p.note || "linked to the existing topic", "skip") : unitCard(p.span, p.note || "proposed topic")).join("")}</div>`,
      fix: ["The AI skips the junk, flags the 2025 line, splits the two facts and sends the clinical tip to the pharmacist", "Dana only finds current, checked content", "The stale file is flagged to its owner instead of quietly staying searchable"],
      fixpath: [["FILE", "FINAL_v1 (2).docx", "added by Priya"], ["SORTED", "Skip, split, route", "proposed by the AI"], ["ROUTED", "Clinical tip to Grace", "stale line to Renee"], ["QUEUED", "Only real knowledge", "waits for approval"]],
      fix4: { line: "The AI sorts the messy file: skip, split, route the clinical tip. A person confirms.", steps: [0], tech: ["LLM-based extraction", "Content-type routing", "PII redaction"], kind: "AI proposes, a person decides", control: "Extraction proposes what to skip, split, read and route; clinical guidance always goes to a clinical approver, never an operational one.", who: "Priya confirms each proposal; Grace gets the clinical tip; Renee the stale-file flag", proof: "Clinical routing check; a not-duplicate pair is never merged (T1); a skipped line is never searchable." } },
    Outbound: { who: "The reminder team copies a price from the copay table in the same shared-drive file.",
      today: () => `${screen("FINAL_v1 (2).docx · copay table", [esc(COPAY)], "No year in the heading the team copied, no owner, no end date.")}${compare("Tier 3 copay: $42 for a 30-day supply, for 2026 only; approved by Grace; ends 31 Dec 2026.", "Your price is $42.", "What the text says", "A number with no year, owner or end date")}`,
      issue: ["A copay table sits in a shared file with no owner and no end date", "June gets a text quoting $42 with nothing saying it's the 2026 price", "In January the same text keeps going out with last year's price"],
      path: [["TABLE", "Copay table", "in a shared file"], ["COPIED", "Into the text", "by the reminder team"], ["NO DATES", "No year, no owner", "no end date"], ["SENT", "'Your price is $42'", "into next year"]],
      now: () => `<div class="units">${unitCard("2026 preferred retail copays", "read from the table · year-bound: 1 Jan to 31 Dec 2026 · approver: Grace", "locked", COPAY)}${unitCard("Ends 31 Dec 2026", "after that, no channel can serve it", "skip")}</div>`,
      fix: ["The AI reads the table into a dated topic: 2026 prices, in force to 31 Dec 2026, owned and approved", "June's reminder links to the current price, labelled with its year", "On 1 Jan the 2026 table stops being served everywhere, by itself"],
      fixpath: [["TABLE", "Copay table", "added by Priya"], ["READ", "Into a dated topic", "2026 only"], ["APPROVED", "By Grace", "with an end date"], ["SERVED", "Only while in force", "never into 2027"]],
      fix4: { line: "Tables become dated facts with an owner, so a price never outlives its year.", steps: [0, 1], tech: ["Table extraction", "Temporal versioning"], kind: "AI proposes, a person decides", control: "Extraction reads the table into a year-bound topic with start and end dates; the dates are applied whenever any channel reads it.", who: "Grace approves pharmacy cost content", proof: "Effective-window check, 0 violations (G4, G20); year-bound cost questions (T11)." } },
    Website: { who: "The website team copied the disclaimer from the Quick Guide, one of three versions.",
      today: () => `<div class="results">${PD_WORDINGS.map(w => `<div><b>${esc(docOf(w.doc).title)}</b> <span class="small">${esc(w.state)}</span><br><span class="small">${esc(w.text)}</span></div>`).join("")}</div>${compare(PD["PD-A"], PD["PD-C"], "What the website shows", "The Quick Guide copy, never approved by Legal")}`,
      issue: ["The same disclaimer sits in three documents with three wordings, and nothing says which Legal approved", "The website shows June a version Legal never approved", "A tool that merged them on its own could silently keep the wrong one"],
      path: [["THREE FILES", "Script v2, v3, Quick Guide", "three wordings"], ["NO OWNER", "Nobody compares them", "copies drift"], ["COPIED", "Website takes the Quick Guide", "by chance"], ["SHOWS", "Unapproved wording", "to every visitor"]],
      now: () => `<div class="units">${unitCard("Same clause found in 3 places", "word-by-word difference shown", "flag")}${unitCard("Proposed: keep Legal's 2026 wording", "the 2027 draft stays in review; the Quick Guide wording retires", "")}${unitCard("Nothing merged", "Tom decides which wording stands", "skip")}</div>${compare(PD["PD-A"], PD["PD-C"], "The Quick Guide copy", "Proposed to retire; Tom decides")}`,
      fix: ["The AI finds all three copies and shows the differences word by word; it proposes, it never merges", "The website shows June Legal's wording", "Tom decides once, and the other copies point to the one that stands"],
      fixpath: [["THREE FILES", "Script v2, v3, Quick Guide", "ingested"], ["MATCHED", "Same clause, 3 wordings", "difference shown"], ["PROPOSED", "Keep Legal's 2026", "never merged"], ["DECIDED", "By Tom", "others point to it"]],
      fix4: { line: "The AI finds every copy and proposes one; Tom decides which wording stands.", steps: [0, 1], tech: ["Semantic deduplication", "Knowledge graph"], kind: "AI proposes, a person decides", control: "Dedup scores similar text and proposes; locked words are never merged automatically, and a different wording always goes to review.", who: "Priya proposes; Tom decides which wording holds", proof: "Search returns one result, not three (G1, G2); a not-duplicate pair is never merged (T1)." } }
  }
};

ACT.lead = "Priya, the author"; ACT.steps = [["Voice", "Extract topics and lock legal words"], ["Advocate desk", "Sort the messy file"], ["Member chat", "Strip planted instructions"], ["Outbound", "Turn tables into dated facts"], ["Website", "Find every copy"]]; ACT.howIndex = 0;
</script>
