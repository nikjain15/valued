  <div class="jy-track">${JOURNEY.map(([lane, st], L) => `<div class="jy-seg"><span class="jy-ln">${esc(lane)}</span><div class="jy-dots">${st.map((x, i) => { const n = L * 7 + i; return `<button class="jy-d ${x[4] === "mix" ? "build" : x[4]}" data-j="${n}" title="${esc(x[0])}"><i>${n + 1}</i><span>${esc(x[0])}</span></button>`; }).join("")}</div></div>`).join("")}</div>
  <div class="jy-card" id="jyc"></div>
  <div class="jy-nav"><button class="btn sm" id="jyp">← Back</button><span class="small" id="jyk"></span><button class="btn sm primary" id="jyn">Next step →</button></div></div>`;
let jc = 0;
function jyGo(n) { jc = Math.max(0, Math.min(JS.length - 1, n)); const { lane, x } = JS[jc], [t, d, who, tool, tag] = x;
  document.querySelectorAll(".jy-d").forEach((b, k) => { b.classList.toggle("on", k === jc); b.classList.toggle("past", k < jc); });
  const c = document.getElementById("jyc"); c.classList.remove("in"); void c.offsetWidth; c.classList.add("in");
  c.innerHTML = `<div class="jy-cl"><span class="jy-big">${jc + 1}</span><div><small>${esc(lane)}</small><h4>${esc(t)}</h4><p>${esc(d)}</p></div></div>
    <div class="jy-cr"><div><b>Who</b><span>${esc(ACT[jc + 1])}</span><div>${who.map(w => `<span class="wh ${w}">${WHO[w]}</span>`).join(" ")}</div></div>
    <div><b>Tool</b><span>${esc(tool)}</span></div><div><b>How it is built</b><span>${esc(HOW[jc + 1])}</span></div>
    <div class="jy-what"><b>What we build or buy</b><ul>${WHAT[jc + 1].map(([k, t]) => `<li><span class="bt ${k}">${TAG[k]}</span> ${esc(t)}</li>`).join("")}</ul></div></div>`;
  document.getElementById("jyk").textContent = `Step ${jc + 1} of ${JS.length}`;
  document.getElementById("jyp").disabled = jc === 0; document.getElementById("jyn").textContent = jc === JS.length - 1 ? "Start again ↺" : "Next step →"; }
let shown = 1;
document.getElementById("stage").innerHTML = `<p class="eyebrow">Plan to build the future state</p>
  <h2 class="hl">From prototype to production: six phases, each with a gate it must pass.</h2>
  <button class="jy-open" id="jyo" aria-expanded="false">Follow one answer through the system: who does each step, and what we build or buy ▾</button><div id="jyb" hidden>${journeyHTML()}</div><p class="eyebrow" style="margin-top:18px">The six phases</p><div class="tl"><div class="tl-line"><i id="tlfill"></i></div>${STEPS_R.map((r, i) => `<button class="tl-n" data-n="${i}"><span class="tl-d">${i + 1}</span><span class="tl-t">${esc(r[0])}</span></button>`).join("")}</div>
  <div id="phcard" class="phcard"></div>
  <div class="foot" style="margin-top:16px"><button class="btn" id="php">← Previous</button><span class="small" id="phc"></span><button class="btn primary" id="phn">Next phase →</button></div>`;
let cur = 0;
document.querySelectorAll(".jy-d").forEach(b => b.onclick = () => jyGo(+b.dataset.j)); document.getElementById("jyp").onclick = () => jyGo(jc - 1); document.getElementById("jyn").onclick = () => jyGo(jc === JS.length - 1 ? 0 : jc + 1); jyGo(0);
document.getElementById("jyo").onclick = e => { const b = document.getElementById("jyb"), o = b.hidden; b.hidden = !o; e.currentTarget.setAttribute("aria-expanded", o); e.currentTarget.textContent = o ? "Hide ▴" : "Follow one answer through the system: who does each step, and what we build or buy ▾"; };
if (location.hash === "#journey") document.getElementById("jyo").click();
function card(i) { const r = STEPS_R[i], x = EXTRA[i], j = JOBS_P[i];
  return `<div class="pc-top"><div><small>Phase ${i + 1} of ${STEPS_R.length}</small><h3>${esc(r[0])}</h3><p>${esc(r[1])}</p></div><div class="ph-jobs">${j.length ? j.map(t => `<span>Builds ${esc(t)}</span>`).join("") : `<span class="pre">Before any build</span>`}</div></div>
  <div class="pc-grid"><div class="pc-b"><b>What we do</b><ul>${r[2].map(t => `<li>${esc(t)}</li>`).join("")}</ul></div><div class="pc-b ok"><b>Success looks like</b><ul class="tk">${r[3].map(t => `<li>${esc(t)}</li>`).join("")}</ul></div><div class="pc-b"><b>Delivers</b><p>${esc(x[0])}</p></div><div class="pc-b risk"><b>Biggest risk, and how we handle it</b><p>${esc(x[1])}</p></div><div class="pc-b"><b>Techniques we use</b><ul>${TT[i][0].map(t => `<li>${esc(t)}</li>`).join("")}</ul></div><div class="pc-b"><b>Tools, and build or buy</b><ul class="tt">${TT[i][1].map(([t, b, why]) => `<li class="${b === "build" ? "isb" : ""}">${esc(t)} <em class="${b === "build" ? "bd" : "by"}">${esc(b)}</em>${why ? `<small>${esc(why)}</small>` : ""}</li>`).join("")}</ul></div></div>${FR_P[i].length ? `<div class="pc-fr"><b>Requirements it delivers</b>${FR_P[i].map(([id, n]) => `<a href="prd.html#fr">${esc(id)} ${esc(n)}</a>`).join("")}<span>See how each is built and accepted in the PRD →</span></div>` : `<div class="pc-fr"><b>Requirements it delivers</b><span>None yet: discovery confirms them before any build</span></div>`}`; }
function go(i) { cur = Math.max(0, Math.min(STEPS_R.length - 1, i)); const c = document.getElementById("phcard"); c.classList.remove("in"); void c.offsetWidth; c.innerHTML = card(cur); c.classList.add("in");
  document.querySelectorAll(".tl-n").forEach((b, k) => { b.classList.toggle("on", k === cur); b.classList.toggle("done", k < cur); });
  document.getElementById("tlfill").style.width = (cur / (STEPS_R.length - 1) * 100) + "%";
  document.getElementById("phc").textContent = `Phase ${cur + 1} of ${STEPS_R.length} · use ← →`;
  document.getElementById("php").style.visibility = cur ? "visible" : "hidden";
  const n = document.getElementById("phn"); n.textContent = cur < STEPS_R.length - 1 ? "Next phase →" : "Next: Trade-offs →"; n.onclick = () => cur < STEPS_R.length - 1 ? go(cur + 1) : (location.href = "choices.html"); }
document.querySelectorAll(".tl-n").forEach(b => b.onclick = () => go(+b.dataset.n));
document.getElementById("php").onclick = () => go(cur - 1);
go(0);
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { go(cur + 1); e.preventDefault(); } if (e.key === "ArrowLeft") { go(cur - 1); e.preventDefault(); } });
document.querySelector("main").insertAdjacentHTML("beforeend", `<p class="small" style="margin-top:14px">Phase gates and order from the PRD, section 14. Discovery, shadow mode and change management are our recommended delivery practice. Timings are left out until discovery sizes them.</p>`);
</script></body></html>
